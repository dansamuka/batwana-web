name: Import Batwana V3 overhaul

on:
  push:
    branches: [v3-overhaul-staging]
    paths:
      - '.v3src/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified overhaul seed
        shell: bash
        run: |
          set -euo pipefail
          cat .v3src/chunk-*.b64 > /tmp/v3seed.b64
          base64 --decode /tmp/v3seed.b64 > /tmp/v3seed.tar.gz
          echo "86a81235fa1da4344b003832bf3f87a5a37d59799daba24931adf18f8370bbae  /tmp/v3seed.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v3seed.tar.gz -C .

      - name: Generate deterministic motion and derived brand assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python tools/make-frames.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path('.')
          logo = Image.open(root/'assets/logo/batwana-logo.png').convert('RGBA')
          top = logo.crop((0, 0, logo.width, 66))
          alpha = top.getchannel('A')
          bbox = alpha.getbbox()
          mark_src = top.crop(bbox) if bbox else top

          def square_mark(size, margin, background=None):
              canvas = Image.new('RGBA', (size, size), background or (0,0,0,0))
              max_side = size - margin*2
              scale = min(max_side/mark_src.width, max_side/mark_src.height)
              im = mark_src.resize((max(1,int(mark_src.width*scale)), max(1,int(mark_src.height*scale))), Image.Resampling.LANCZOS)
              canvas.alpha_composite(im, ((size-im.width)//2, (size-im.height)//2))
              return canvas

          (root/'assets/logo').mkdir(parents=True, exist_ok=True)
          square_mark(101, 4).save(root/'assets/logo/batwana-mark.png')
          square_mark(32, 2).save(root/'assets/logo/icon-32.png')
          square_mark(180, 16).save(root/'assets/logo/icon-180.png')
          square_mark(512, 48).save(root/'assets/logo/icon-512.png')
          square_mark(512, 112, (42,34,102,255)).save(root/'assets/logo/icon-maskable-512.png')

          og = Image.new('RGB', (1200, 630), (42,34,102))
          reversed_logo = Image.open(root/'assets/logo/batwana-logo-reversed.png').convert('RGBA')
          target_w = 500
          s = target_w / reversed_logo.width
          rl = reversed_logo.resize((target_w, int(reversed_logo.height*s)), Image.Resampling.LANCZOS)
          og_rgba = og.convert('RGBA')
          og_rgba.alpha_composite(rl, ((1200-rl.width)//2, (630-rl.height)//2))
          og_rgba.convert('RGB').save(root/'assets/og-image.png', optimize=True)

          splat_dir = root/'assets/splat'
          splat_dir.mkdir(parents=True, exist_ok=True)
          for name, color, wh in [
              ('mark-green.png',(157,205,89,255),(200,200)),
              ('mark-red.png',(238,67,46,255),(174,200)),
              ('mark-amber.png',(254,185,27,255),(195,200)),
          ]:
              w,h = wh
              im = Image.new('RGBA',(w,h),(0,0,0,0)); d = ImageDraw.Draw(im)
              d.ellipse((w*.14,h*.12,w*.86,h*.84), fill=color)
              d.ellipse((w*.02,h*.38,w*.33,h*.69), fill=color)
              d.ellipse((w*.67,h*.02,w*.95,h*.35), fill=color)
              d.ellipse((w*.69,h*.67,w*.98,h*.96), fill=color)
              im.save(splat_dir/name)
          PY

      - name: Validate imported V3
        shell: bash
        run: |
          set -euo pipefail
          test "$(find assets/act -name 'f*.webp' | wc -l)" -eq 72
          test -s assets/act/still.webp
          test -s assets/logo/batwana-logo.png
          test -s assets/logo/icon-180.png
          test -s assets/og-image.png
          grep -q 'assets/act/f' index.html
          grep -q 'saveData' index.html
          grep -q 'prefers-reduced-motion' index.html
          grep -q 'https://dansamuka.github.io/batwana-web/' index.html
          python - <<'PY'
          from pathlib import Path
          import json, re
          h = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', h, re.S|re.I)
          assert blocks, 'missing JSON-LD'
          for b in blocks: json.loads(b)
          assert h.lower().count('<h1') == 1
          PY

      - name: Commit clean V3 staging tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v3src .github
          git config user.name "dansamuka"
          git config user.email "dansamuka@gmail.com"
          git add -A
          git commit -m "Implement Batwana V3 overhaul"
          git push --force origin HEAD:v3-overhaul-staging
