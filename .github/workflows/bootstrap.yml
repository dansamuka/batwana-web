name: Bootstrap reviewed Batwana source

on:
  push:
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct reviewed source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-*.b64 > /tmp/batwana-reviewed.b64
          base64 --decode /tmp/batwana-reviewed.b64 > /tmp/batwana-reviewed.zip
          mkdir -p /tmp/batwana-reviewed
          unzip -q /tmp/batwana-reviewed.zip -d /tmp/batwana-reviewed
          rsync -a --delete --exclude='.git' /tmp/batwana-reviewed/ ./
      - name: Commit reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dansamuka"
          git config user.email "dansamuka@gmail.com"
          git add -A
          git commit -m "Import reviewed Batwana web source"
          git push origin HEAD:main
