name: Crisp hero imagery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/crisp-hero.yml"
      - "tools/crisp_hero.py"

permissions:
  contents: write

jobs:
  sharpen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Re-render hero assets and tune presentation
        run: python tools/crisp_hero.py
      - name: Commit sharpened hero
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html assets/photos/hero-*.webp
          git diff --cached --quiet && exit 0
          git commit -m "Sharpen hero imagery [skip ci]"
          git push
