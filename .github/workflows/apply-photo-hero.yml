name: Apply photo hero
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-photo-hero.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply corrected photo hero
        run: python3 tools/apply_photo_hero.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/photos/hero-01.webp assets/photos/hero-02.webp assets/photos/hero-03.webp assets/photos/hero-04.webp assets/photos/party-slot.svg assets/photos/school-slot.svg assets/photos/corporate-slot.svg assets/photos/crew-slot.svg
          git diff --cached --quiet || git commit -m "Replace top graphics with seamless photo hero"
          git push origin HEAD:main
