name: Apply static no-blur hero

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lock-static-hero.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Link static hero stylesheet
        run: |
          python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); m="<link rel=\"stylesheet\" href=\"assets/hero-static-lock.css?v=20260906\">"; p.write_text(s if m in s else s.replace("</head>", m+"\n</head>", 1), encoding="utf-8")'

      - name: Commit hero lock
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply static no-blur hero lock"
          git push
